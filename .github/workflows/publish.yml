name: Publish to Maven Central

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # manual run -> publishes the current -SNAPSHOT, to smoke-test credentials

jobs:
  publish:
    name: Bundle + upload to Central Portal
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reserved for a future move to keyless (Sigstore/OIDC) signing - Maven
      # Central does not yet offer OIDC *trusted publishing* the way NuGet does,
      # so the Portal upload still authenticates with a token. See
      # docs/publishing.md for the reasoning and the migration plan.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # A v* tag -> a real release, version from the tag, uploaded as a draft
      # deployment (USER_MANAGED) for a human to release in the portal.
      # A manual run -> the current -SNAPSHOT from gradle.properties, published
      # to the Central snapshots repo (not a permanent release).
      - name: Resolve target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "task=nmcpPublishAggregationToCentralPortal" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "task=nmcpPublishAggregationToCentralPortalSnapshots" >> "$GITHUB_OUTPUT"
          fi

      - name: Build + test
        run: ./gradlew build ${{ steps.target.outputs.version && format('-Pversion={0}', steps.target.outputs.version) }} --stacktrace

      - name: Bundle + upload
        run: >
          ./gradlew ${{ steps.target.outputs.task }}
          ${{ steps.target.outputs.version && format('-Pversion={0}', steps.target.outputs.version) }}
          --stacktrace
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          # Only set if the key has a passphrase; GitHub rejects empty secrets,
          # so a passphrase-less key omits it and the build defaults it to "".
          SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
